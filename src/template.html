<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Azure Atlas</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <main id="stage" aria-label="Azure architecture diagram"></main>

  <header id="top">
    <div class="brand glass">
      <div class="logo"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="5.5" height="5.5" rx="1.4"/><rect x="10.5" y="10.5" width="5.5" height="5.5" rx="1.4"/><path d="M7.5 4.75H11a2 2 0 0 1 2 2v3.75"/></svg></div>
      <div><b>Azure Atlas</b><span id="meta">Offline view of a read-only snapshot</span><button id="check" class="ok" type="button">Layout check</button></div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search names, types, tags, IPs   ( / )" autocomplete="off" spellcheck="false"></div>
    <div class="tools glass">
      <button id="b-fit" title="Fit to screen (f)" aria-label="Fit to screen"><svg viewBox="0 0 18 18"><path d="M3 7V3h4M11 3h4v4M15 11v4h-4M7 15H3v-4"/></svg></button>
      <button id="b-out" title="Zoom out (-)" aria-label="Zoom out"><svg viewBox="0 0 18 18"><path d="M4 9h10"/></svg></button>
      <button id="b-in" title="Zoom in (+)" aria-label="Zoom in"><svg viewBox="0 0 18 18"><path d="M4 9h10M9 4v10"/></svg></button>
      <i class="sep"></i>
      <button id="b-theme" title="Light / dark (t)" aria-label="Toggle theme"><svg viewBox="0 0 18 18"><path d="M15 10.5A6.5 6.5 0 1 1 7.5 3a5 5 0 0 0 7.5 7.5z"/></svg></button>
      <button id="b-open" title="Open another snapshot" aria-label="Open snapshot"><svg viewBox="0 0 18 18"><path d="M2.5 5.5a1.5 1.5 0 0 1 1.5-1.5h3l1.5 1.8H14a1.5 1.5 0 0 1 1.5 1.5V13a1.5 1.5 0 0 1-1.5 1.5H4A1.5 1.5 0 0 1 2.5 13z"/></svg></button>
      <i class="sep"></i>
      <button id="b-svg" title="Export SVG" aria-label="Export SVG"><svg viewBox="0 0 18 18"><path d="M9 2.5v8M5.8 7.8 9 11l3.2-3.2M3 13.5v1h12v-1"/></svg></button>
      <button id="b-png" title="Export PNG" aria-label="Export PNG"><svg viewBox="0 0 18 18"><rect x="2.5" y="3.5" width="13" height="11" rx="2"/><circle cx="6.5" cy="7.5" r="1.2"/><path d="m3 13 4-3.5 3 2.5 2-1.5 3 2.5"/></svg></button>
    </div>
  </header>

  <section id="panel" class="glass">
    <h5>Connections</h5>
    <div id="fams"></div>
    <h5>Layout</h5>
    <label class="opt">Resource groups
      <select id="opt-rg"><option value="loose">Loose resources</option><option value="all">Around everything</option><option value="off">Hidden</option></select>
    </label>
    <label class="opt">Managed identities <input type="checkbox" id="opt-id"></label>
  </section>

  <aside id="drawer" class="glass"><button id="drawer-close" aria-label="Close">&times;</button><div id="drawer-body"></div></aside>

  <div id="drop" hidden>
    <div>
      <h1>Azure Atlas</h1>
      <p>Drop an <code>inventory.json</code> snapshot here. Create one with the <code>AzureInfraDiagram</code> PowerShell module. The file is read in your browser only. Nothing is uploaded and no Azure call is made.</p>
      <button id="drop-open">Open snapshot</button><button id="drop-sample" class="alt">Try the sample</button>
    </div>
  </div>
  <div id="busy" hidden>Laying out diagram...</div>
  <div id="toast" hidden></div>
  <input type="file" id="file" accept=".json,application/json" hidden>
</div>
<!--__DATA__-->
<!--__SAMPLE__-->
<script>/*__JS__*/</script>
</body>
</html>
